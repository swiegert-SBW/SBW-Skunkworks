name: Archive short interest
on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 1,16 * *"
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/archive_short_interest.py
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/short-interest/
          if ! git diff --cached --quiet; then
            git commit -m "data: archive short interest [skip render]"
            git push
          fi
