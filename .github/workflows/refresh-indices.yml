name: Validate index snapshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate uploaded holdings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for index,minimum in [('sp500',490),('russell2000',1800)]:
              data=json.loads((Path('data/indices')/(index+'.json')).read_text())
              rows=data['constituents']
              assert len(rows)>=minimum, f'{index}: insufficient constituents'
              assert all('weightPercent' in r and 'sector' in r for r in rows)
              print(index,len(rows),'total equity weight',round(sum(r['weightPercent'] for r in rows),4))
          PY
