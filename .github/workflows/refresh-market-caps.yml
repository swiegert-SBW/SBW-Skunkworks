name: Refresh yfinance market caps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/refresh_market_caps.py"
      - ".github/workflows/refresh-market-caps.yml"
  schedule:
    - cron: "15 3 * * 1-5"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=0.2.65,<2" "pandas>=2.2,<3" lxml html5lib requests
      - run: python scripts/refresh_market_caps.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-caps.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh yfinance market caps"
            git push
          fi
