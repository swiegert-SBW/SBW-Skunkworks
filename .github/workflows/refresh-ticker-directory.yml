name: Refresh ticker company directory
on:
  schedule:
    - cron: '17 7 1 1,4,7,10 *'
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-ticker-directory.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh company names
        run: python scripts/update_ticker_directory.py
      - name: Commit updated directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ticker-company-names.json
          if ! git diff --cached --quiet; then
            git commit -m "Quarterly ticker company directory refresh"
            git push
          fi
