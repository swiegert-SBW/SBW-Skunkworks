name: Validate V94
on:
  push:
    branches: [feature/v94-speed-charts-mark]
  workflow_dispatch:
concurrency:
  group: v94-validation
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
